<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      -webkit-user-select: none;
    }
    .stop-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-stop {
      background: #1A1A1A;
      color: #00FF87;
      border: 1.5px solid #00FF87;
      border-radius: 6px;
      padding: 5px 16px;
      font-size: 12px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.7);
      letter-spacing: 0.02em;
      -webkit-app-region: no-drag;
    }
    .btn-stop:hover { background: #00FF87; color: #111; }
    .btn-stop:active { transform: scale(0.97); }
    .rec-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #FF4444;
      animation: pulse 1s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
    .frame-border {
      position: absolute;
      top: 40px; left: 0; right: 0; bottom: 0;
      border: 2px solid #00FF87;
      border-radius: 2px;
      box-shadow: 0 0 0 1px rgba(0,255,135,0.15), 0 0 10px rgba(0,255,135,0.15);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="stop-bar">
    <button class="btn-stop" id="btn-stop">
      <div class="rec-dot"></div>
      Stop Recording
    </button>
  </div>
  <div class="frame-border"></div>
  <script>
    document.getElementById('btn-stop').addEventListener('click', () => {
      window.frameAPI.stop();
    });
  </script>
</body>
</html>
